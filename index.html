function parse(t,p){const side=PS.includes(p.n)||/\/\s*side|each side/i.test(t)?2:1;let m;
 if(m=t.match(/(\d+)\s*x\s*(\d+)\s*breaths/i))return{k:'t',sets:+m[1],n:+m[2],u:'br',side};
 if(m=t.match(/(\d+)(?:\s*[–-]\s*\d+)?\s*min/i))return{k:'t',sets:1,n:+m[1]*60,u:'s',side};
 if(m=t.match(/(\d+)(?:\s*[–-]\s*\d+)?\s*s\b/i))return{k:'t',sets:1,n:+m[1],u:'s',side};
 if(m=t.match(/(\d+)(?:\s*[–-]\s*\d+)?\s*breaths/i))return{k:'t',sets:1,n:+m[1],u:'br',side};
 if(m=t.match(/(\d+)\s*(?:slow\s*)?(?:rounds|reps)/i)||t.match(/x\s*(\d+)/i)||t.match(/^(\d+)\b/))return{k:'c',n:+m[1],side};
 if(m=t.match(/(\d+)\s*$/))return{k:'t',sets:1,n:+m[1],u:'br',side};
 return{k:'n',side}}

function item(n,k){const i=ix(n),p=P[i],j=p.L.length?lvl(i):-1,t=j>=0?p.L[j]:p.h,tp=parse(t,p),d=document.createElement('div');d.className='ti';
 d.innerHTML=`<div class="fw">${p.f.map(f=>fig(f,p.f.length>1?'20 -4 70 80':'0 0 120 80',BR.includes(p.n))).join('')}</div><div class="tf"><h3>${k+1}. ${p.n}<small>wk ${p.w}${p.n=='Eagle'?'+ · optional':''}</small></h3>
<div>${j>=0?`<span class="bd">L${j+1}</span>`:''}${tp.side>1?'<span class="bd">each side</span>':''}<b>${t}</b></div>${s[i+'L']?'':'<p class="wh">New? Learn the form first, then tick Learned on Progress.</p>'}
<div class="tm"></div><p class="sf">${p.sf}</p><div class="ar"><label class="ck"><input type="checkbox"> Done</label><button class="lk">Cues</button></div></div><ol hidden>${p.st.split('|').map(x=>`<li>${x}</li>`).join('')}</ol>`;
 const cb=d.querySelector('input'),tm=d.querySelector('.tm'),fin=()=>{cb.checked=true;dn.add(k);upd()};
 cb.onchange=()=>{cb.checked?dn.add(k):dn.delete(k);upd()};
 d.querySelector('.lk').onclick=()=>{const o=d.querySelector('ol');o.hidden=!o.hidden};
 if(tp.k=='c'){let c=0;tm.innerHTML=`<button class="pill on">+1 rep</button><span class="tr c">0/${tp.n}</span>`;
  tm.querySelector('button').onclick=()=>{sesGo();if(c>=tp.n)c=0;c++;tm.querySelector('span').textContent=c+'/'+tp.n;if(c>=tp.n)fin()}}
 if(tp.k=='t'){const sd=tp.side>1?['Left','Right']:[''],per=tp.u=='br'?tp.n*5:tp.n,segs=[];
  for(let a=1;a<=tp.sets;a++)for(const x of sd){if(segs.length)segs.push({l:'Rest',d:8,r:1});segs.push({l:[tp.sets>1?`Set ${a}/${tp.sets}`:'',x].filter(Boolean).join(' · ')||'Hold',d:per,u:tp.u,n:tp.n})}
  tm.innerHTML=`<button class="pill on">Start</button><button class="pill">Reset</button><span class="tr"></span><div class="bar"><i></i></div>`;
  const [b,rb]=tm.querySelectorAll('button'),r=tm.querySelector('.tr'),bi=tm.querySelector('i');let idx=0,left=segs[0].d,iv=null;
  const show=()=>{const g=segs[Math.min(idx,segs.length-1)];r.textContent=`${g.l} · ${mm(left)}`+(g.u=='br'?` · breath ${Math.min(g.n,Math.floor((g.d-left)/5)+1)}/${g.n}`:'');bi.style.width=100*(g.d-left)/g.d+'%'};
  const stop=()=>{clearInterval(iv);iv=null;if(act===stop)act=null;b.textContent=idx>=segs.length?'Again':(idx||left<segs[0].d)?'Resume':'Start'};
  const rst=()=>{stop();idx=0;left=segs[0].d;b.textContent='Start';show()};
  const tick=()=>{left--;if(left<=0){idx++;if(idx>=segs.length){stop();left=0;idx=segs.length-1;show();idx=segs.length;b.textContent='Again';fin();return}left=segs[idx].d}show()};
  b.onclick=()=>{if(iv){stop();return}if(idx>=segs.length)rst();if(act)act();act=stop;sesGo();iv=setInterval(tick,1000);b.textContent='Pause'};
  rb.onclick=rst;show();tm._stop=stop}
 return d}

else [['L','Learned'],[1,'Level 1'],[2,'Level 2'],[3,'Level 3']].forEach(([k,n])=>{const v=P.map((p,i)=>[p,i]).filter(([p])=>k=='L'||k<=p.L.length);h+=`<div class="r l rh" style="margin-top:22px"><b>${n}<small>${v.filter(([,i])=>s[i+''+k]).length}/${v.length}</small></b><span></span></div>`+v.map(([p,i])=>`<div class="r l"><span>${p.n}</span>${cb(i,k)}</div>`).join('')});
